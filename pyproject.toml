[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polite-scraper"
version = "1.0.0"
description = "A polite, validated Books to Scrape catalogue scraper"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.6,<3",
    "requests>=2.31,<3",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
